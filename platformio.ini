; Bichito: mascota virtual para M5Stack Cardputer ADV
;
; Dos entornos:
;   cardputer-adv  compila y sube al equipo
;   pruebas        corre la logica del nucleo en el Mac, sin hardware
;
; Subir al equipo:   pio run -e cardputer-adv -t upload
; Ver el monitor:    pio device monitor
; Correr pruebas:    pio test -e pruebas

[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 1500000
; El USB-JTAG del S3 se cae al cargar el stub de esptool cuando ya hay
; firmware propio corriendo. Con el cargador de la ROM va mas lento pero
; no se cae.
upload_flags = --no-stub
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv

; El teclado del ADV cuelga de un controlador I2C (TCA8418), no de la matriz
; GPIO del Cardputer original. Estas versiones minimas ya traen esa deteccion.
lib_deps =
    m5stack/M5Cardputer@^1.1.0
    m5stack/M5Unified@^0.2.8

build_flags =
    -std=gnu++17
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_unflags = -std=gnu++11

[env:pruebas]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I lib/nucleo
